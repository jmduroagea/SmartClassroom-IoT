name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    container: python:3.9-slim-bullseye   # same Python and Debian as the Pis
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest tests/unit

  web:
    runs-on: ubuntu-latest
    container: node:20-bullseye-slim      # same Node major as the brain Pi
    defaults:
      run:
        working-directory: server/web
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm test --if-present

  scenarios:
    runs-on: ubuntu-latest      # not inside a container: it starts containers itself
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/scenarios
